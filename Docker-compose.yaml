version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: auth-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
      POSTGRES_DB: auth_db
    volumes:
      - auth-db:/var/lib/postgresql/data
  redis:
    image: redis:7.2-alpine
    container_name: auth-nosql
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis123
    volumes:
        - auth-nosql:/data
volumes:
  auth-db:
  auth-nosql: